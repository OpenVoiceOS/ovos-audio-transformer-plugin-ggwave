[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-audio-transformer-plugin-ggwave"
dynamic = ["version"]
description = "ggwave data-over-sound audio transformer plugin for OVOS"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ggwave>=0.4.2,<1.0.0",
    "numpy"
]

[project.optional-dependencies]
test = [
    "pytest",
    "ovoscope>=0.20.0",
    "ovos-dinkum-listener>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-audio-transformer-plugin-ggwave"

[project.entry-points."opm.transformer.audio"]
"ovos-audio-transformer-plugin-ggwave" = "ovos_audio_transformer_plugin_ggwave:GGWavePlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_audio_transformer_plugin_ggwave.version.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_audio_transformer_plugin_ggwave*"]

[tool.setuptools.package-data]
ovos_audio_transformer_plugin_ggwave = [
    "locale/**/*",
]
