[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-audio-transformer-plugin-ggwave"
dynamic = ["version"]
description = "A speech lang detection plugin for mycroft"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.0",
    "Programming Language :: Python :: 3.1",
    "Programming Language :: Python :: 3.2",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<2.2.0",
    "ggwave>=0.4.2,<1.0.0",
    "PyAudio~=0.2.14"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-audio-transformer-plugin-ggwave"

[project.entry-points."neon.plugin.audio"]
"ovos-audio-transformer-plugin-ggwave" = "ovos_audio_transformer_plugin_ggwave:GGWavePlugin"

[project.scripts]
ovos-ggwave-listener = "ovos_audio_transformer_plugin_ggwave:launch_cli"

[tool.setuptools.dynamic]
version = {attr = "ovos_audio_transformer_plugin_ggwave.version.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_audio_transformer_plugin_ggwave*"]

[tool.setuptools.package-data]
ovos_audio_transformer_plugin_ggwave = [
    "locale/**/*",
]
